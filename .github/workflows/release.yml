name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and release (for example v0.1.0)
        required: true
        type: string
      draft:
        description: Create a draft release for asset verification
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.11.0', 26]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e "const p=require('./package.json'); if (process.env.RELEASE_TAG !== 'v'+p.version) throw Error('Release tag must match package version '+p.version)"
      - run: npm ci
      - run: npm run build
      - run: npm test -- --maxWorkers=2
      - run: npm run typecheck
      - run: node scripts/smoke-npm-package.mjs

  npm-package:
    name: Build npm package
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p release-assets
      - run: npm pack --pack-destination release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release-assets/*.tgz
          if-no-files-found: error

  standalone:
    name: Build standalone on ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - run: npm run package:standalone -- standalone
      - run: node scripts/smoke-standalone.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: standalone/
          if-no-files-found: error

  release:
    name: Assemble and publish release
    needs: [npm-package, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Archive standalone artifacts and create checksums
        run: |
          mkdir distribution
          cp incoming/npm-package/*.tgz distribution/
          for dir in incoming/standalone-*; do
            name="${dir#incoming/}"
            tar -czf "distribution/${name}.tar.gz" -C "$dir" .
          done
          (cd distribution && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          draft: ${{ inputs.draft }}
          name: Quick LLM Memory ${{ inputs.tag }}
          body_path: docs/release-notes.md
          files: distribution/*
