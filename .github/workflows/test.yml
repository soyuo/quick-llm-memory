name: Test

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['24.11.0', 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies and build native helpers
        run: npm ci
      - name: Build CLI for process lifecycle integration tests
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Check types
        run: npm run typecheck
