name: Standalone packages

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package standalone on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm prune --omit=dev
      - run: npm run package:standalone -- standalone
      - run: node scripts/smoke-standalone.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qlm-standalone-${{ runner.os }}-${{ runner.arch }}
          path: standalone/
          if-no-files-found: error
          retention-days: 14
